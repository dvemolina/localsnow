name: PR Checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: localsnow
          POSTGRES_PASSWORD: localsnow
          POSTGRES_DB: localsnow_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      NODE_OPTIONS: --max-old-space-size=4096
      PROJECT_URL: http://localhost:5173
      DATABASE_URL: postgresql://localsnow:localsnow@localhost:5432/localsnow_ci
      GOOGLE_CLIENT_ID: ci-google-client-id
      GOOGLE_CLIENT_SECRET: ci-google-client-secret
      R2_ACCOUNT_ID: ci-r2-account-id
      R2_ACCESS_KEY_ID: ci-r2-access-key-id
      R2_SECRET_ACCESS_KEY: ci-r2-secret-access-key
      TURNSTILE_SECRET_KEY: ci-turnstile-secret-key
      CRON_SECRET: ci-cron-secret
      CALENDAR_TOKEN_ENCRYPTION_KEY: ci-calendar-token-encryption-key-32chars
      EMAIL_HEADER_SECRET: ci-email-header-secret
      STRIPE_SECRET_KEY: sk_test_ci
      STRIPE_WEBHOOK_SECRET: whsec_ci
      SENTRY_DSN: https://examplePublicKey@o0.ingest.sentry.io/0
      GA_MEASUREMENT_ID: G-CI00000000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.23.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test:run

      - name: Build production bundle
        run: pnpm run build
